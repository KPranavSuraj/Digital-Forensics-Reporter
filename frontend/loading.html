<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AUTOPSY SIM - Digital Forensics Bureau</title>
<script>
(function(){
  var T='AUTOPSY SIM - Digital Forensics Bureau';
  try{ Object.defineProperty(document,'title',{get:function(){return T;},set:function(){},configurable:false}); }
  catch(e){}
})();
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050709;color:#c8d4e0;font-family:'Courier New',monospace;display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:1rem}
</style>
</head>
<body>
<div style="font-size:1.6rem;letter-spacing:.3em;color:#fff;font-weight:bold">AUTOPSY SIM</div>
<div style="color:#c8392b;font-size:.85rem;letter-spacing:.2em">DIGITAL FORENSICS BUREAU</div>
<div style="color:#506070;font-size:.75rem;margin-top:.5rem" id="st">Connecting...</div>
<div style="width:200px;height:2px;background:#1a2535;margin-top:.5rem">
  <div id="bar" style="height:100%;width:0%;background:#c8392b;transition:width .4s"></div>
</div>
<script>
var n=0, done=false;
function check(){
  fetch('http://127.0.0.1:8000')
    .then(function(r){
      if(r.ok && !done){
        done=true;
        document.getElementById('bar').style.width='100%';
        document.getElementById('st').textContent='Ready!';
        setTimeout(function(){
          window.location.replace('http://127.0.0.1:8000');
        }, 300);
      } else if(!done){ retry(); }
    })
    .catch(function(){ if(!done) retry(); });
}
function retry(){
  n++;
  document.getElementById('bar').style.width=Math.min(n*8,90)+'%';
  document.getElementById('st').textContent='Starting... ('+n+')';
  setTimeout(check,1000);
}
check();
</script>
</body>
</html>
